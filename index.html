<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maldives Local Councils Directory — Island, Atoll & City Councils</title>
<meta name="description" content="A central public directory of Island Councils, Atoll Councils, elected Councillors, Mayors and Secretary Generals across the Maldives.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600;700&family=Noto+Sans+Thaana:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A2540; --navy-2:#0E3157; --ocean:#155E92; --ocean-soft:#EAF3F9;
  --teal:#12A296; --teal-dark:#0C7E75; --teal-soft:#E4F5F3;
  --mist:#F4F7F9; --card:#FFFFFF; --ink:#16303F; --slate:#5A7184; --line:#DCE6EC;
  --v-green:#177A4C; --v-green-bg:#E7F4EC;
  --v-blue:#1B5FA8; --v-blue-bg:#E9F1FB;
  --v-amber:#B26E0F; --v-amber-bg:#FCF3E3;
  --v-grey:#63737F; --v-grey-bg:#EEF1F3;
  --v-red:#B3372F; --v-red-bg:#FBEAE8;
  --r:14px; --r-sm:9px;
  --shadow:0 1px 2px rgba(10,37,64,.06),0 6px 18px rgba(10,37,64,.07);
  --shadow-lg:0 2px 4px rgba(10,37,64,.08),0 14px 34px rgba(10,37,64,.12);
  --disp:'Bricolage Grotesque',system-ui,sans-serif; --body:'Public Sans',system-ui,sans-serif;
  --thaana:'Noto Sans Thaana',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}
body{font-variant-numeric:tabular-nums;font-family:var(--body);background:var(--mist);color:var(--ink);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--ocean);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:var(--body);cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:4px}
.wrap{max-width:1160px;margin:0 auto;padding:0 18px}
.thaana{font-family:var(--thaana);direction:rtl}

/* ---------- Telegram Mini App ---------- */
body.tg .govbar,body.tg .masthead,body.tg footer.site .foot-base{display:none}
body.tg header.site{position:static;border-top:none}
body.tg nav.mainnav{border-top:none}
body.tg .hero-inner{padding:22px 0 20px}
body.tg h1.hero-h{font-size:clamp(24px,7vw,32px)}
body.tg .hero-sub{font-size:14.5px}
body.tg section.block{padding:22px 0}
body.tg footer.site{margin-top:24px}
/* ---------- Gov bar + header ---------- */
.govbar{background:var(--navy);color:#BBD3E4;font-size:12.5px;padding:6px 0;letter-spacing:.02em}
.govbar .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.govbar strong{color:#fff;font-weight:600}
header.site{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.masthead{display:flex;align-items:center;gap:12px;padding:12px 0}
.crest{width:44px;height:44px;border-radius:12px;background:linear-gradient(145deg,var(--navy),var(--ocean));display:grid;place-items:center;flex:none}
.crest svg{width:26px;height:26px}
.mast-title{font-family:var(--disp);font-weight:800;font-size:17px;line-height:1.15;color:var(--navy);letter-spacing:-.01em}
.mast-sub{font-family:var(--thaana);font-size:13px;color:var(--slate);direction:rtl;text-align:left}
.mast-spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:999px;font-weight:600;font-size:14.5px;padding:10px 18px;border:1.5px solid transparent;transition:background .15s,color .15s,border-color .15s;text-decoration:none!important}
.btn-primary{background:var(--teal);color:#fff}
.btn-primary:hover{background:var(--teal-dark)}
.btn-ghost{background:#fff;color:var(--navy);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--ocean);color:var(--ocean)}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover{background:var(--navy-2)}
.btn-sm{padding:7px 13px;font-size:13.5px}
nav.mainnav{border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav.mainnav::-webkit-scrollbar{display:none}
nav.mainnav ul{display:flex;gap:2px;list-style:none;padding:0 6px}
nav.mainnav a{display:block;padding:11px 13px;font-size:14px;font-weight:600;color:var(--slate);white-space:nowrap;border-bottom:3px solid transparent;text-decoration:none!important}
nav.mainnav a:hover{color:var(--navy)}
nav.mainnav a.active{color:var(--navy);border-bottom-color:var(--teal)}

/* ---------- Demo notice ---------- */
.demo-note{background:var(--v-amber-bg);border-bottom:1px solid #EBD9B4;color:#7A5210;font-size:13.5px;padding:8px 0}
.demo-note .wrap{display:flex;gap:8px;align-items:flex-start}

/* ---------- Hero ---------- */
.hero{background:linear-gradient(160deg,var(--navy) 0%,#0D3B66 55%,#11507C 100%);color:#fff;position:relative;overflow:hidden}
.hero-ring{position:absolute;right:-90px;top:-60px;opacity:.5;pointer-events:none}
.hero-inner{position:relative;padding:56px 0 44px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8FD6CE;margin-bottom:14px}

h1.hero-h{font-family:var(--disp);font-weight:800;font-size:clamp(32px,6vw,54px);line-height:1.02;letter-spacing:-.03em;max-width:13ch}
.hero-thaana{font-family:var(--thaana);direction:rtl;text-align:left;font-size:clamp(16px,2.5vw,21px);color:#9FC3DB;margin-top:10px}
.hero-sub{max-width:56ch;color:#C6DAE9;margin-top:14px;font-size:16.5px}
.searchbar{margin-top:26px;max-width:640px;display:flex;background:#fff;border-radius:999px;padding:6px;box-shadow:var(--shadow-lg)}
.searchbar input{flex:1;border:none;background:none;font:inherit;font-size:15.5px;padding:8px 10px 8px 16px;color:var(--ink);min-width:0}
.searchbar input:focus{outline:none}
.searchbar button{border:none;background:var(--teal);color:#fff;font-weight:700;font-size:14.5px;border-radius:999px;padding:10px 20px}
.searchbar button:hover{background:var(--teal-dark)}
.quicknav{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}
.quicknav a{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.22);color:#EAF3F9;border-radius:999px;padding:8px 15px;font-size:13.5px;font-weight:600;text-decoration:none!important}
.quicknav a:hover{background:rgba(255,255,255,.18)}

/* ---------- Stats ---------- */
.stats{background:#fff;border-bottom:1px solid var(--line)}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line)}
.stat b{letter-spacing:-.02em}
.stat{background:#fff;padding:18px 16px}
.stat b{font-family:var(--disp);font-weight:800;font-size:26px;color:var(--navy);display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--slate);font-weight:600}
.stat small{display:block;font-size:11.5px;color:#8CA0AE;margin-top:2px}
@media(max-width:720px){.stats-grid{grid-template-columns:repeat(2,1fr)}}

/* ---------- Atoll rail (signature): north-to-south, height = council count ---------- */
.rail{background:#fff;border-bottom:1px solid var(--line);padding:0}
.rail-inner{display:flex;align-items:flex-end;gap:2px;overflow-x:auto;scrollbar-width:none;padding:16px 0 0}
.rail-inner::-webkit-scrollbar{display:none}
.rail-i{flex:1 0 auto;min-width:46px;display:flex;flex-direction:column;align-items:center;gap:6px;
 text-decoration:none!important;padding-bottom:12px;border-bottom:2px solid transparent;transition:border-color .15s}
.rail-i:hover{border-bottom-color:var(--teal)}
.rail-i:hover .bar{background:var(--teal)}
.bar{width:100%;max-width:26px;background:var(--ocean-soft);border-radius:3px 3px 0 0;transition:background .15s}
.rail-i.city .bar{background:var(--teal-soft)}
.rail-code{font-family:var(--disp);font-weight:700;font-size:12.5px;color:var(--navy);letter-spacing:-.01em}
.rail-n{font-size:10px;color:#8CA0AE;font-weight:600}
.rail-cap{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.12em;
 text-transform:uppercase;color:#8CA0AE;font-weight:700;padding:0 0 10px}
/* ---------- Atoll band (legacy) ---------- */
.atollband{padding:26px 0 8px}
.band-label{font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--slate);margin-bottom:10px;display:flex;gap:10px;align-items:center}
.band-label::after{content:"";flex:1;height:1px;background:var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;scrollbar-width:thin}
.chip{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;min-width:64px;text-decoration:none!important;transition:border-color .15s}
.chip:hover{border-color:var(--teal)}
.chip b{font-family:var(--disp);font-weight:800;font-size:15px;color:var(--navy)}
.chip span{font-size:10.5px;color:var(--slate);font-weight:600;white-space:nowrap}
.chip.city b{color:var(--teal-dark)}

/* ---------- Seat composition ---------- */
.seats{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seatrow{display:flex;gap:3px;align-items:flex-end}
.seat{width:11px;height:11px;border-radius:50%;background:var(--pc,#8CA0AE);flex:none}
.seat.head{width:14px;height:14px;box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--pc,#8CA0AE)}
.seat-label{font-size:12px;font-weight:700;color:var(--ink);letter-spacing:.01em}
.seat-label i{font-style:normal;font-weight:600;color:var(--slate)}
.seat-key{width:9px;height:9px;border-radius:50%;display:inline-block;vertical-align:-1px;margin-right:4px;background:var(--pc)}
/* ---------- Sections / cards ---------- */
.faces{display:flex;align-items:center;gap:-8px;padding:0}
.faces .f{width:38px;height:38px;border-radius:50%;border:2.5px solid #fff;background:var(--mist);
 overflow:hidden;display:grid;place-items:center;margin-left:-10px;box-shadow:0 1px 3px rgba(10,37,64,.14);flex:none}
.faces .f:first-child{margin-left:0}
.faces .f img{width:100%;height:100%;object-fit:cover}
.faces .f span{font-family:var(--disp);font-weight:700;font-size:12px;color:var(--slate)}
.faces .more{font-size:12px;color:var(--slate);font-weight:600;margin-left:10px}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 0}
.atoll-tag{font-family:var(--disp);font-weight:700;font-size:11.5px;letter-spacing:.04em;
 color:var(--ocean);background:var(--ocean-soft);border-radius:6px;padding:3px 8px}
.card h3{margin-top:2px}

section.block{padding:38px 0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
h2.sec{font-family:var(--disp);font-weight:700;font-size:clamp(21px,3vw,28px);color:var(--navy);letter-spacing:-.02em}
.sec-desc{color:var(--slate);font-size:14.5px;max-width:64ch;margin-top:4px}
.grid{display:grid;gap:16px}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
@media(max-width:960px){.grid-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.grid-3,.grid-2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.card-img{height:120px;position:relative;display:flex;align-items:flex-end;padding:12px}
.card-img .logo{width:46px;height:46px;border-radius:11px;background:#fff;display:grid;place-items:center;box-shadow:var(--shadow);font-family:var(--disp);font-weight:800;color:var(--navy);font-size:15px}
.card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:9px;flex:1}
.card h3{font-family:var(--disp);font-weight:700;font-size:16.5px;color:var(--navy);letter-spacing:-.01em;line-height:1.25}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--ocean-soft);color:var(--ocean)}
.tag.type{background:var(--teal-soft);color:var(--teal-dark)}
.kv{font-size:13.5px;color:var(--slate);display:grid;gap:4px}
.kv b{color:var(--ink);font-weight:600}
.card-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:11px;border-top:1px solid var(--line);font-size:12px;color:#8CA0AE}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-official{background:var(--v-green-bg);color:var(--v-green)}
.b-multi{background:var(--v-blue-bg);color:var(--v-blue)}
.b-partial{background:var(--v-amber-bg);color:var(--v-amber)}
.b-unverified{background:var(--v-grey-bg);color:var(--v-grey)}
.b-outdated{background:var(--v-red-bg);color:var(--v-red)}
.b-demo{background:var(--navy);color:#fff}
.b-demo::before{display:none}

/* ---------- People ---------- */
.pphoto{position:relative;width:104px;height:104px;margin:0 auto 6px;flex:none}
.pphoto .ring{position:absolute;inset:0;border-radius:50%;padding:5px;background:var(--pc,#8CA0AE)}
.pphoto .inner{width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--mist);display:grid;place-items:center}
.pphoto img{width:100%;height:100%;object-fit:cover;display:block}
.pphoto .ini{font-family:var(--disp);font-weight:800;font-size:28px;color:var(--slate)}
.pchip{position:absolute;left:50%;transform:translateX(-50%);bottom:-9px;background:var(--pc,#8CA0AE);
 color:#1b1b1b;font-size:11px;font-weight:800;border-radius:999px;padding:3px 12px;white-space:nowrap;
 box-shadow:0 2px 6px rgba(10,37,64,.18);border:2px solid #fff}
.pchip.light{color:#fff}
.pcard.photo{align-items:center;text-align:center;padding-top:20px}
.pcard.photo h3{font-size:19px;line-height:1.35}
.latin{font-size:13.5px;color:var(--slate);font-weight:600;letter-spacing:.01em;margin-top:1px}
.latin-sm{font-size:12px;color:#8CA0AE;font-weight:500;display:block}

.avatar{border-radius:50%;background:linear-gradient(150deg,var(--ocean),var(--navy));color:#fff;display:grid;place-items:center;font-family:var(--disp);font-weight:700;flex:none}
.avatar.teal{background:linear-gradient(150deg,var(--teal),var(--teal-dark))}
.pcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px}
.pcard .top{display:flex;gap:12px;align-items:center}
.pcard .avatar{width:52px;height:52px;font-size:17px}
.pcard h3{font-family:var(--disp);font-weight:700;font-size:15.5px;color:var(--navy);line-height:1.2}
.pcard .pos{font-size:12.5px;color:var(--teal-dark);font-weight:700}
.pcard .sub{font-size:12.5px;color:var(--slate)}
.plist{font-size:13px;color:var(--slate);display:grid;gap:4px}
.plist b{color:var(--ink);font-weight:600}

/* ---------- Filters / toolbar ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:16px}
.toolbar input[type=search],.toolbar select{border:1.5px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-size:14px;padding:9px 12px;color:var(--ink)}
.toolbar input[type=search]{flex:1;min-width:170px}
.toolbar select{max-width:180px}
.seg{display:inline-flex;background:#fff;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:none;padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--slate)}
.seg button.on{background:var(--navy);color:#fff}
.count-note{font-size:13px;color:var(--slate)}

/* ---------- Table ---------- */
.tablewrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow-x:auto}
table.dir{width:100%;border-collapse:collapse;font-size:13.5px;min-width:760px}
table.dir th{background:var(--mist);text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);padding:11px 13px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
table.dir th .arrow{opacity:.45;font-size:10px}
table.dir td{padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:top}
table.dir tr:last-child td{border-bottom:none}
table.dir tr:hover td{background:#FAFCFD}

/* ---------- Profile page ---------- */
.crumbs{font-size:13px;color:var(--slate);padding:16px 0 0}
.profile-hero{background:linear-gradient(150deg,var(--navy),#104A75);border-radius:var(--r);color:#fff;padding:24px;margin-top:14px;position:relative;overflow:hidden}
.profile-hero .inner{display:flex;gap:18px;align-items:center;position:relative;flex-wrap:wrap}
.profile-hero .logo{width:70px;height:70px;border-radius:16px;background:#fff;color:var(--navy);display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:22px;box-shadow:var(--shadow-lg)}
.profile-hero h1{font-family:var(--disp);font-weight:800;font-size:clamp(22px,4vw,32px);letter-spacing:-.015em;line-height:1.1}
.profile-hero .sub{color:#BBD3E4;font-size:14px;margin-top:5px}
.twocol{display:grid;grid-template-columns:2fr 1fr;gap:18px;align-items:start}
@media(max-width:860px){.twocol{grid-template-columns:1fr}}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.panel h3{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--navy);margin-bottom:12px;display:flex;gap:8px;align-items:center}
.dl{display:grid;grid-template-columns:130px 1fr;gap:7px 12px;font-size:13.5px}
.dl dt{color:var(--slate);font-weight:600}
.dl dd{color:var(--ink)}
.na{color:#94A6B2;font-style:italic}
.svc{display:flex;flex-wrap:wrap;gap:7px}
.svc span{background:var(--mist);border:1px solid var(--line);border-radius:999px;font-size:12.5px;font-weight:600;color:var(--slate);padding:5px 11px}
.source-box{background:var(--mist);border:1px dashed var(--line);border-radius:var(--r-sm);padding:11px 13px;font-size:12.5px;color:var(--slate)}
.source-box b{color:var(--ink)}

/* ---------- Inline edit ---------- */
.edit-btn{position:absolute;top:16px;right:16px;z-index:2}
.profile-hero .inner{padding-right:96px}
.ed{background:rgba(255,255,255,.13);border:1.5px solid rgba(255,255,255,.35);border-radius:8px;
 color:#fff;font:inherit;padding:5px 9px;width:100%;max-width:520px}
.ed:focus{outline:2px solid var(--teal);background:rgba(255,255,255,.2)}
.ed.h1{font-family:var(--disp);font-weight:800;font-size:clamp(20px,3.6vw,28px);letter-spacing:-.015em}
.ed.sm{font-size:13.5px;max-width:300px}
.ed option{color:#16303F}
.ed-dark{border:1.5px solid var(--line);border-radius:8px;font:inherit;font-size:13.5px;padding:6px 9px;width:100%;background:#fff;color:var(--ink)}
.ed-dark:focus{outline:2px solid var(--teal)}
.editbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px;
 background:rgba(255,255,255,.1);border:1px dashed rgba(255,255,255,.3);border-radius:10px;padding:10px 12px}
.editbar label{font-size:12px;font-weight:700;color:#BBD3E4;white-space:nowrap}
.pending{background:var(--v-amber-bg);border:1px solid #EBD9B4;color:#7A5210;border-radius:var(--r-sm);
 padding:10px 14px;font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
/* ---------- Forms ---------- */
.form{display:grid;gap:14px;max-width:680px}
.form label{font-size:13px;font-weight:700;color:var(--navy);display:grid;gap:6px}
.form input,.form select,.form textarea{border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:14.5px;padding:10px 12px;background:#fff;color:var(--ink);font-weight:400}
.form textarea{min-height:90px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}
.notice{border-radius:var(--r-sm);padding:12px 14px;font-size:13.5px}
.notice.info{background:var(--ocean-soft);color:#12466E}
.notice.ok{background:var(--v-green-bg);color:var(--v-green)}

/* ---------- Admin ---------- */
.admin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:860px){.admin-grid{grid-template-columns:repeat(2,1fr)}}
.admin-tile{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.admin-tile b{font-family:var(--disp);font-size:22px;color:var(--navy);display:block}
.admin-tile span{font-size:12.5px;color:var(--slate);font-weight:600}
.rolebar{display:flex;gap:7px;flex-wrap:wrap}
.rolebar span{background:var(--navy);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:4px 11px}
.rolebar span.dim{background:var(--v-grey-bg);color:var(--v-grey)}

/* ---------- Footer ---------- */
footer.site{background:var(--navy);color:#A9C2D4;margin-top:44px;font-size:13.5px}
.foot-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:26px;padding:38px 0 26px}
@media(max-width:820px){.foot-grid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.foot-grid{grid-template-columns:1fr}}
footer h4{font-family:var(--disp);color:#fff;font-size:14px;font-weight:700;margin-bottom:10px}
footer ul{list-style:none;display:grid;gap:7px}
footer a{color:#A9C2D4}
footer a:hover{color:#fff}
.foot-base{border-top:1px solid rgba(255,255,255,.14);padding:16px 0 22px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;color:#7E9CB3}
.disclaimer{font-size:12.5px;color:#7E9CB3;line-height:1.6;margin-top:10px}
.empty{background:#fff;border:1.5px dashed var(--line);border-radius:var(--r);padding:34px 20px;text-align:center;color:var(--slate)}
.empty b{display:block;font-family:var(--disp);color:var(--navy);font-size:16px;margin-bottom:5px}
mark{background:#FDF0C9;border-radius:3px;padding:0 2px}
</style>

const TH_C={'\u0780':'h','\u0781':'sh','\u0782':'n','\u0783':'r','\u0784':'b','\u0785':'lh','\u0786':'k','\u0787':'','\u0788':'v','\u0789':'m','\u078A':'f','\u078B':'dh','\u078C':'th','\u078D':'l','\u078E':'g','\u078F':'gn','\u0790':'s','\u0791':'d','\u0792':'z','\u0793':'t','\u0794':'y','\u0795':'p','\u0796':'j','\u0797':'ch','\u0798':'th','\u0799':'h','\u079A':'kh','\u079B':'z','\u079C':'z','\u079D':'sh','\u079E':'s','\u079F':'z','\u07A0':'t','\u07A1':'z','\u07A2':'','\u07A3':'gh','\u07A4':'q','\u07A5':'w'};
const TH_V={'\u07A6':'a','\u07A7':'aa','\u07A8':'i','\u07A9':'ee','\u07AA':'u','\u07AB':'oo','\u07AC':'e','\u07AD':'ey','\u07AE':'o','\u07AF':'oa','\u07B0':''};
function latinName(s){let o="";
 for(const ch of String(s)){
  if(ch===" ")o+=" ";
  else if(TH_C[ch]!==undefined)o+=TH_C[ch];
  else if(TH_V[ch]!==undefined)o+=TH_V[ch];
  else if(/[\u0780-\u07BF]/.test(ch))continue;   // any unmapped Thaana mark: skip, never leak
  else o+=ch;}
 return o.replace(/\s+/g," ").trim().split(" ").filter(Boolean).map(w=>{
   w=w.replace(/u$/,"");                          // drop the word-final short vowel
   w=w.replace(/dh$/,"d").replace(/th$/,"th");
   return w?w.charAt(0).toUpperCase()+w.slice(1):"";}).filter(Boolean).join(" ")||String(s);}

function composition(cid){
 const seats=PEOPLE.filter(p=>p.council===cid&&p.cat!=="sg"&&p.cat!=="wdc").sort((a,b)=>a.rank-b.rank);
 if(!seats.length)return null;
 const tally={};seats.forEach(p=>tally[p.party]=(tally[p.party]||0)+1);
 const ranked=Object.entries(tally).sort((a,b)=>b[1]-a[1]);
 const [top,n]=ranked[0];
 const tied=ranked.length>1&&ranked[1][1]===n;
 const outright=n>seats.length/2;
 return {seats,top,n,tied,outright,total:seats.length};
}
function seatStrip(cid){
 const c=composition(cid);if(!c)return "";
 const dots=c.seats.map(p=>`<span class="seat ${p.rank===1?"head":""}" style="--pc:${(PARTYCOLOR[p.party]||["#8CA0AE"])[0]}" title="${esc(p.position)} \u2014 ${esc(PARTY[p.party]||p.party)}"></span>`).join("");
 const col=(PARTYCOLOR[c.top]||["#8CA0AE"])[0];
 const label=c.tied?`<i>No majority \u00b7 ${c.total} seats</i>`
  :`<span class="seat-key" style="--pc:${col}"></span>${esc(c.top==="IND"?"Independents":c.top)} <i>${c.outright?"hold":"lead"} ${c.n} of ${c.total}</i>`;
 return `<div class="seats"><span class="seatrow">${dots}</span><span class="seat-label">${label}</span></div>`;
}

 const key=sortKey;list.sort((a,b)=>String(a[key]??"").localeCompare(String(b[key]??""))*(sortAsc?1:-1));
 const rows=list.map(c=>{const pres=PEOPLE.find(p=>p.council===c.id&&(p.position==="Council President"||p.position==="Mayor"));
  const sg=PEOPLE.find(p=>p.council===c.id&&p.cat==="sg");
  const n=PEOPLE.filter(p=>p.council===c.id&&p.cat!=="sg"&&p.cat!=="wdc").length;
  return {c,pres,sg,n};});
 window.__exportCSV=()=>download("councils.csv",toCSV([["Council","Type","Atoll","Island/Jurisdiction","President/Mayor","Secretary General","Councillors","Phone","Email","Verification","Last updated"],
  ...rows.map(r=>[r.c.name,r.c.type,r.c.atoll+". "+r.c.atollName,r.c.jurisdiction,r.pres?r.pres.name+" (sample)":"Not publicly available",r.sg?r.sg.name+" (sample)":"Not publicly available",r.n,r.c.phone,r.c.email,VLABEL[r.c.ver],r.c.updated])]));
 const th=(label,k)=>`<th scope="col" onclick="setSort('${k}')">${label} <span class="arrow">${sortKey===k?(sortAsc?"▲":"▼"):"↕"}</span></th>`;
 return `<div class="wrap"><section class="block">
 <div class="sec-head"><div><h2 class="sec">${type||"All councils"}</h2><p class="sec-desc">Searchable register of every island, atoll and city council. Official contact records from the Local Government Authority register.</p></div></div>
 <div class="toolbar">
  <input type="search" value="${esc(q)}" placeholder="Search council, island, person or atoll code…" aria-label="Search councils" oninput="qNav('#/councils',this.value,'${esc(type)}')">
  <select aria-label="Council type" onchange="location.hash='#/councils?type='+encodeURIComponent(this.value)+'&q=${encodeURIComponent(q)}'">
   <option value="">All types</option>${["Island Council","City Council"].map(t=>`<option ${t===type?"selected":""}>${t}</option>`).join("")}</select>
  <span class="seg" role="group" aria-label="View mode"><button class="${viewMode==="grid"?"on":""}" onclick="viewMode='grid';render()">Grid</button><button class="${viewMode==="table"?"on":""}" onclick="viewMode='table';render()">Table</button></span>
  <button class="btn btn-ghost btn-sm" onclick="__exportCSV()">↓ Export CSV</button>
  <span class="count-note">${list.length} of ${COUNCILS.length} councils</span></div>
 ${list.length===0?`<div class="empty"><b>No councils match your search</b>Try an island name, atoll code (e.g. “S.” or “AA.”) or a councillor's name.</div>`:
  viewMode==="grid"?`<div class="grid grid-3">${list.map(c=>councilCard(c,q)).join("")}</div>`:
  `<div class="tablewrap"><table class="dir"><thead><tr>${th("Council","name")}${th("Type","type")}${th("Atoll","atollName")}${th("Island / jurisdiction","island")}<th>President / Mayor</th><th>Secretary General</th><th>Cllrs</th><th>Phone</th><th>Verification</th>${th("Updated","updated")}</tr></thead>
  <tbody>${rows.map(r=>`<tr><td><a href="#/council/${r.c.id}"><b>${hi(r.c.name,q)}</b></a></td><td>${r.c.type}</td><td>${r.c.atoll}. ${r.c.atollName}</td><td>${esc(r.c.island)}</td>
   <td>${r.pres?'<span class="thaana">'+esc(r.pres.name)+'</span><span class="latin-sm">'+esc(latinName(r.pres.name))+'</span>':'<span class="na">N/A</span>'}</td><td>${r.sg?esc(r.sg.name):'<span class="na">Not listed</span>'}</td><td>${r.n}</td><td>${na(r.c.phone)}</td><td>${badge(r.c.ver)}</td><td>${r.c.updated}</td></tr>`).join("")}</tbody></table></div>`}
 </section></div>`;}
function saveCouncil(id){
 const g=k=>{const el=document.getElementById("e_"+k);return el?el.value.trim():undefined;};
 const src=g("src");
 if(!src){alert("A source URL is required. Every change must be traceable to an official source.");return;}
 const patch={name:g("name"),type:g("type"),jurisdiction:g("jur"),ver:g("ver"),
  address:g("address"),phone:g("phone"),email:g("email"),website:g("website")||null,
  facebook:g("facebook")||null,hours:g("hours"),population:g("population"),area:g("area"),
  source:{name:"Edited locally \u2014 pending review",url:src},
  updated:new Date().toISOString().slice(0,10),checked:new Date().toISOString().slice(0,10)};
 Object.keys(patch).forEach(k=>{if(patch[k]===undefined)delete patch[k];});
 EDITS[id]={...(EDITS[id]||{}),...patch};
 saveEdits();applyEdits();editMode=false;render();
}
function revertCouncil(id){if(!confirm("Discard local changes to this council?"))return;
 delete EDITS[id];saveEdits();location.reload();}
function exportEdits(){
 const rows=[["council_id","field","new_value","source_url","edited_on"]];
 for(const id in EDITS){const e=EDITS[id];
  for(const k in e){if(k==="source")continue;
   rows.push([id,k,typeof e[k]==="object"?JSON.stringify(e[k]):e[k],(e.source&&e.source.url)||"",e.updated||""]);}}
 if(rows.length===1){alert("No local edits to export.");return;}
 download("council-edits.csv",toCSV(rows));
}
function clearEdits(){if(!confirm("Discard ALL local edits? This cannot be undone."))return;
 for(const k in EDITS)delete EDITS[k];saveEdits();location.reload();}
function setSort(k){if(sortKey===k)sortAsc=!sortAsc;else{sortKey=k;sortAsc=true;}render();}
let qTimer;function qNav(base,val,type){clearTimeout(qTimer);qTimer=setTimeout(()=>{const p=new URLSearchParams();if(type)p.set("type",type);if(val)p.set("q",val);history.replaceState(null,"",base+(p.toString()?"?"+p.toString():""));render(true);},250);}

   :`<div><div class="meta" style="margin-bottom:7px"><span class="tag type" style="background:rgba(255,255,255,.14);color:#8FD6CE">${c.type}</span></div>

  </div></div>
 <section class="block"><div class="twocol">
  <div style="display:grid;gap:18px">
   ${EDITS[c.id]?`<div class="pending"><span>\u270e <b>Local edits not published.</b> These changes are saved in this browser only \u2014 they are not visible to anyone else until exported and committed.</span>
     <button class="btn btn-ghost btn-sm" onclick="exportEdits()">\u2193 Export edits</button>
     <button class="btn btn-ghost btn-sm" onclick="revertCouncil('${c.id}')">Revert</button></div>`:""}
   ${c.note?`<div class="panel" style="border-color:#EBD9B4;background:var(--v-amber-bg)"><h3 style="color:#7A5210">\u26a0 Source discrepancy</h3><p style="font-size:13.5px;color:#7A5210;margin:0">${esc(c.note)}</p></div>`:""}
   <div class="panel"><h3>Council overview</h3>
    <p style="font-size:14px;color:var(--slate);margin-bottom:14px">${esc(c.about)}</p>
    <dl class="dl">
     ${[["address","Official address"],["phone","Official phone"],["email","Official email"],
        ["website","Website"],["facebook","Facebook"],["hours","Office hours"],
        ["population","Population"],["area","Geographic area"]].map(([k,lab])=>
      `<dt>${lab}</dt><dd>${editMode
        ?`<input class="ed-dark" id="e_${k}" value="${esc(c[k]==null?"":c[k])}" aria-label="${lab}">`

    ${seatStrip(c.id)?`<div style="margin:-4px 0 16px">${seatStrip(c.id)}</div>`:""}

function viewPeople(kind,params){const q=(params.get("q")||"").trim();
 const fAtoll=params.get("atoll")||"",fType=params.get("ctype")||"",fPos=params.get("pos")||"";
 let list=PEOPLE.filter(p=>kind==="sg"?p.cat==="sg":kind==="wdc"?p.cat==="wdc":(p.cat!=="sg"&&p.cat!=="wdc"));
 list=list.filter(p=>{const c=councilById(p.council);
  return (!q||p.name.includes(q)||latinName(p.name).toLowerCase().includes(q.toLowerCase())||c.name.toLowerCase().includes(q.toLowerCase())||c.island.toLowerCase().includes(q.toLowerCase())||(PARTY[p.party]||"").toLowerCase().includes(q.toLowerCase())||p.party.toLowerCase()===q.toLowerCase())
   &&(!fAtoll||c.atoll===fAtoll)&&(!fType||c.type===fType)&&(!fPos||p.position===fPos)&&(!params.get("party")||p.party===params.get("party"));});
 const positions=[...new Set(PEOPLE.filter(p=>kind==="sg"?p.cat==="sg":p.cat!=="sg").map(p=>p.position))];
 const title=kind==="sg"?"Secretary General directory":kind==="wdc"?"Women\u2019s Development Committee leaders":"Councillor directory";
 const desc=kind==="sg"?"Appointed Secretary Generals across all councils.":kind==="wdc"?"Elected WDC presidents and vice presidents \u2014 statutory bodies rarely documented in one place.":"Every elected Mayor, President and Councillor, filterable by atoll, council type, position, ward and party.";
 const setP=(k)=>`onchange="filterNav('${kind==="sg"?"#/sg":"#/councillors"}','${k}',this.value)"`;
 return `<div class="wrap"><section class="block">
 <div class="sec-head"><div><h2 class="sec">${title}</h2><p class="sec-desc">${desc}</p></div></div>
 <div class="toolbar">
  <input type="search" value="${esc(q)}" placeholder="Search by name, council or ward…" aria-label="Search people" oninput="filterNav('${kind==="sg"?"#/sg":"#/councillors"}','q',this.value,true)">
  <select aria-label="Atoll" ${setP("atoll")}><option value="">All atolls</option>${ATOLLS.map(a=>`<option value="${a.code}" ${a.code===fAtoll?"selected":""}>${a.code}. ${a.name}</option>`).join("")}</select>
  <select aria-label="Council type" ${setP("ctype")}><option value="">All council types</option>${["Island Council","City Council"].map(t=>`<option ${t===fType?"selected":""}>${t}</option>`).join("")}</select>
  <select aria-label="Position" ${setP("pos")}><option value="">All positions</option>${positions.map(t=>`<option ${t===fPos?"selected":""}>${t}</option>`).join("")}</select>
  ${kind==="sg"?"":`<select aria-label="Party" onchange="filterNav('#/councillors','party',this.value)"><option value="">All parties</option>${Object.keys(PARTY).map(t=>`<option value="${t}" ${t===(params.get("party")||"")?"selected":""}>${PARTY[t]}</option>`).join("")}</select>`}
  <span class="count-note">${list.length} listed</span></div>
 ${list.length?`<div class="grid grid-3">${list.slice(0,120).map(p=>personCard(p,q)).join("")}</div>${list.length>120?`<p class="count-note" style="margin-top:14px">Showing the first 120 of ${list.length}. Use the filters or search to narrow the list.</p>`:""}`:`<div class="empty"><b>No matching records</b>Adjust the atoll, council type, position or party filters, or search a name in Thaana or an island in English.</div>`}
 </section></div>`;}
function filterNav(base,key,val,debounce){const run=()=>{const p=new URLSearchParams(location.hash.split("?")[1]||"");if(val)p.set(key,val);else p.delete(key);
 history.replaceState(null,"",base+(p.toString()?"?"+p.toString():""));render(true);};
 if(debounce){clearTimeout(qTimer);qTimer=setTimeout(run,250);}else run();}

    <p style="font-size:12px;color:var(--slate);margin-top:10px">Imports are validated against the councils, people and sources schemas before commit.</p></div>
 </div></div></section></div>`;}
window.__exportAll=()=>download("directory-export.csv",toCSV([["record_type","id","name","council","position","atoll","verification","last_updated"],
 ...COUNCILS.map(c=>["council",c.id,c.name,"","",c.atoll,VLABEL[c.ver],c.updated]),
 ...PEOPLE.map(p=>["person",p.id,p.name,councilById(p.council).name,p.position,councilById(p.council).atoll,VLABEL[p.ver],p.updated])]));
window.__exportTemplate=()=>download("import-template-councils.csv",toCSV([["council_id","council_name","council_type","atoll_code","atoll_name","island_name","city_name","jurisdiction","official_address","official_phone","official_email","website","facebook","logo_url","council_photo_url","island_photo_url","office_hours","population","latitude","longitude","verification_status","source_url","last_checked","last_updated"]]));

function viewAbout(){return `<div class="wrap"><section class="block" style="max-width:820px">
 <h2 class="sec">About this directory</h2>
 <div style="display:grid;gap:18px;margin-top:16px">
  <div class="panel"><h3>Purpose</h3><p style="font-size:14px;color:var(--slate)">A single, trustworthy place to find any Island Council, Atoll Council or City Council in the Maldives — its elected leadership, councillors, Secretary General, and official contact details — for government, corporate, media, NGO, tourism and public-sector use.</p></div>
  <div class="panel"><h3>Data sources & priority</h3><p style="font-size:14px;color:var(--slate)">Records are sourced, in order of priority, from: the Local Government Authority; official council websites; official council Facebook pages; government press releases; official political-party profiles; verified LinkedIn profiles; and credible news publications. Every record stores its source name, URL, publication date and the date it was accessed.</p></div>
  <div class="panel"><h3>Verification policy</h3><p style="font-size:14px;color:var(--slate);margin-bottom:10px">Nothing is invented. Where information is unavailable the record displays <i>Not publicly available</i> or <i>Pending verification</i>. Badges indicate confidence:</p>
   <div style="display:flex;gap:8px;flex-wrap:wrap">${Object.keys(VLABEL).map(v=>badge(v)).join("")}</div>
   <p style="font-size:13px;color:var(--slate);margin-top:10px">Records not reviewed within six months are automatically flagged for re-checking. “100% verified” is never claimed unless every displayed record genuinely is.</p></div>
  <div class="panel"><h3>Reconciliation with LGA records</h3>
   <p style="font-size:14px;color:var(--slate);margin-bottom:10px">LGA maintains two registers that do not fully agree. Where they differ, this directory records both and says so rather than silently picking one.</p>
   <ul style="font-size:13.5px;color:var(--slate);display:grid;gap:8px;padding-left:18px">
    <li><b>Councillor register:</b> 178 island councils, 5 city councils, 677 councillors. Every councillor here comes from it, and the totals match exactly.</li>
    <li><b>Council contact register:</b> lists HDh. Hirimaradhoo as an active council with an official phone and email, though it has no entry in the councillor register. It is listed here with a source note and no councillors.</li>
    <li><b>V. Thinadhoo:</b> two seats published, no council president. Recorded as published.</li>
    <li><b>S. Hulhudhoo and S. Meedhoo:</b> listed by LGA as island councils separate from Addu City Council.</li>
    <li><b>Atoll councils:</b> 2 of 20 imported so far; neither LGA register covers them completely in the pages retrieved.</li>
    <li><b>Secretary Generals:</b> not published in either register, so the directory lists none.</li>
   </ul></div>
  <div class="panel"><h3>Privacy & safety</h3><p style="font-size:14px;color:var(--slate)">Only professional information already published through official or credible public sources is listed. The directory never publishes private residential addresses, personal phone numbers or emails not officially released, national ID or passport details, family information, private social-media accounts, or any sensitive personal information. Official contact details are always clearly separated from anything personal.</p></div>
  <div class="panel"><h3>Photographs</h3><p style="font-size:14px;color:var(--slate)">Images are sourced from publicly available official or verified sources; rights remain with their respective owners. Each image carries alt text, source attribution, source URL, date accessed and any usage note. Where no photo is available, a neutral initials avatar is shown — never an unrelated image.</p></div>
 </div></section></div>`;}

/* ---------------- Router ---------------- */
function render(keepScroll){const hash=location.hash||"#/";
 if(!hash.startsWith("#/council/"))editMode=false;const [path,qs]=hash.slice(1).split("?");const params=new URLSearchParams(qs||"");
 let active="Home",content;
 if(path==="/"||path==="")content=viewHome();
 else if(path==="/councils"){const t=params.get("type");active=t?(t.split(" ")[0]+" Councils"):"All Councils";
  active={"Island Councils":"Island Councils","Atoll Councils":"Atoll Councils","City Councils":"City Councils"}[active]||"All Councils";content=viewCouncils(params);}
 else if(path.startsWith("/council/")){active="All Councils";content=viewCouncil(path.split("/")[2]);}
 else if(path==="/councillors"){active="Councillors";content=viewPeople("cllr",params);}
 else if(path==="/sg"){active="Secretary Generals";content=viewPeople("sg",params);}
 else if(path==="/wdc"){active="WDC Leaders";content=viewPeople("wdc",params);}
 else if(path==="/atolls"){active="Browse by Atoll";content=viewAtolls();}
 else if(path.startsWith("/atoll/")){active="Browse by Atoll";content=viewAtoll(path.split("/")[2]);}
 else if(path==="/submit"){active="Contact";content=viewSubmit();}
 else if(path==="/admin"){content=viewAdmin();}
 else if(path==="/about"){active="About";content=viewAbout();}
 else content=`<div class="wrap"><div class="empty" style="margin:30px 0"><b>Page not found</b><a href="#/">Back to home</a></div></div>`;
 const scroll=keepScroll?window.scrollY:0;
 document.getElementById("app").innerHTML=chrome(active,content);
 if(keepScroll)window.scrollTo(0,scroll);else window.scrollTo(0,0);
 const inp=document.querySelector('.toolbar input[type=search]');
 if(keepScroll&&inp){inp.focus();const v=inp.value;inp.value="";inp.value=v;}}
applyEdits();

/* ---------------- Telegram Mini App ---------------- */
const TG=window.Telegram&&window.Telegram.WebApp;
if(TG&&TG.initData!==undefined){
 document.body.classList.add("tg");
 TG.ready();TG.expand();
 if(TG.setHeaderColor){try{TG.setHeaderColor("#0A2540")}catch(e){}}
 if(TG.enableClosingConfirmation)try{TG.enableClosingConfirmation()}catch(e){}
 // deep link: t.me/<bot>/<app>?startapp=council_addu  ->  #/council/addu
 const sp=(TG.initDataUnsafe||{}).start_param;
 if(sp){const [k,...rest]=sp.split("_");const v=rest.join("_");
  const map={council:"#/council/",atoll:"#/atoll/"};
  if(map[k]&&v)location.hash=map[k]+v;
  else if(k==="councillors")location.hash="#/councillors";
  else if(k==="sg")location.hash="#/sg";
  else if(k==="wdc")location.hash="#/wdc";}
 const syncBack=()=>{const home=(location.hash||"#/")==="#/";
  if(TG.BackButton){home?TG.BackButton.hide():TG.BackButton.show();}};
 if(TG.BackButton)TG.BackButton.onClick(()=>{history.length>1?history.back():location.hash="#/";});
 window.addEventListener("hashchange",syncBack);syncBack();
 // haptic tap on navigation
 document.addEventListener("click",ev=>{const a=ev.target.closest("a[href^='#/']");
  if(a&&TG.HapticFeedback)try{TG.HapticFeedback.selectionChanged()}catch(e){}});
}
window.addEventListener("hashchange",()=>render());
render();
</script>
